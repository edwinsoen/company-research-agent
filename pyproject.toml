[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "company-research-agent"
version = "0.1.0"
description = "Meeting Prep Copilot - ADK Multi-Agent Research Assistant"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "google-adk>=2.8.0",
    "google-genai",
    "pydantic>=2.0",
    "python-dotenv",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "tenacity>=8.2.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["meeting_prep*"]
